name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0
  ACTIONLINT_VERSION: 1.7.7
  GITLEAKS_VERSION: 8.28.0
  TERRAFORM_VERSION: 1.14.7

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.38.0
      - run: yamllint --strict .

  kubernetes-manifests:
    name: helm + crossplane schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install kubeconform and PyYAML
        run: |
          pip install pyyaml
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Validate charts, rendered manifests and Argo CD manifests
        run: ./scripts/validate.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/crossplane-irsa
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: checkov (IAM policy scan)
        run: |
          pip install checkov
          checkov -d . --framework terraform --baseline .checkov.baseline --quiet --compact

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
      - name: No real AWS account IDs or resource IDs
        run: ./scripts/check-sensitive.sh
