# Renders one Argo CD Application per platform-applications/services/*/service.yaml.
# Each Application installs the Helm chart platform-applications/profiles/<profile>.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-services
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - git:
        repoURL: https://github.com/your-org/crossplane-aws-platform.git
        revision: HEAD
        files:
          - path: platform-applications/services/*/service.yaml
  template:
    metadata:
      name: "{{ name }}"
    spec:
      project: platform-services
      destination:
        namespace: "{{ namespace }}"
        server: https://kubernetes.default.svc
      source:
        repoURL: https://github.com/your-org/crossplane-aws-platform.git
        targetRevision: HEAD
        path: platform-applications/profiles/{{ profile }}
        helm:
          valueFiles:
            - ../../services/service.yaml
            - ../../services/{{ name }}/service.yaml
      ignoreDifferences:
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[].route[].weight
        - group: argoproj.io
          kind: Rollout
          jqPathExpressions:
            - .spec.replicas
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            istio-injection: "{{ istio-injection }}"
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          # Keeps replica counts managed by an autoscaler from being reset to the chart value.
          # https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#respect-ignore-differences-configs
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
  syncPolicy:
    preserveResourcesOnDeletion: true
